<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Route Runner Links</title>
  <meta name="description" content="Official Route Runner links." />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      font-family: Georgia, 'Times New Roman', serif;
      background: #000;
      color: #e8e8e8;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, rgba(180, 180, 180, 0.13), transparent 34%),
        linear-gradient(180deg, #050505 0%, #000 100%);
    }

    .page {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .logo-wrap {
      width: 220px;
      height: 220px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 0 18px rgba(210, 210, 210, 0.18));
    }

    h1 {
      font-size: 28px;
      font-weight: 400;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #f2f2f2;
      margin-bottom: 8px;
      text-shadow: 0 0 14px rgba(255, 255, 255, 0.15);
    }

    .subtitle {
      font-family: Arial, sans-serif;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #9d9d9d;
      margin-bottom: 30px;
    }

    .links {
      display: grid;
      gap: 14px;
    }

    .link-button {
      display: block;
      width: 100%;
      padding: 16px 18px;
      border: 1px solid rgba(230, 230, 230, 0.38);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(255,255,255,0.09), rgba(255,255,255,0.025));
      color: #eeeeee;
      text-decoration: none;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 8px 24px rgba(0,0,0,0.4);
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .link-button:hover {
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.8);
      background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.045));
    }

    .footer {
      margin-top: 30px;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #606060;
    }

    @media (max-width: 420px) {
      body {
        padding: 18px;
      }

      .logo-wrap {
        width: 185px;
        height: 185px;
      }

      h1 {
        font-size: 23px;
        letter-spacing: 4px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="logo-wrap">
      <!-- Save your logo image as logo.png in the same folder as this HTML file -->
      <img src="logo.png" alt="Route Runner logo" />
    </div>

    <h1>Route Runner</h1>
    <p class="subtitle">Official Links</p>

    <section class="links" aria-label="Route Runner links">
      <a class="link-button" href="https://instagram.com/" target="_blank" rel="noopener">Instagram</a>
      <a class="link-button" href="#" target="_blank" rel="noopener">Menu</a>
    </section>

    <p class="footer">Route Runner Links</p>
  </main>
</body>
</html>
